name: apps

# Builds the BookPilot desktop installers (Windows, macOS, Linux) and the
# mobile apps (Android, iOS). The apps open the server in the repository
# variable BOOKPILOT_URL (Settings → Secrets and variables → Actions →
# Variables); without it they open https://bookpilot-web.onrender.com.
# Download the results from the run's "Artifacts" section.

on:
  workflow_dispatch:
  push:
    # with only a tag filter GitHub would skip branch pushes, so list both
    branches: ['**']
    tags: ['app-v*']
    paths:
      - 'desktop/**'
      - 'mobile/**'
      - 'static/icons/**'
      - '.github/workflows/apps.yml'

env:
  BOOKPILOT_URL: ${{ vars.BOOKPILOT_URL || 'https://bookpilot-web.onrender.com' }}

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: desktop/dist/*.exe
          - os: macos-latest
            target: --mac
            files: desktop/dist/*.dmg
          - os: ubuntu-latest
            target: --linux
            files: desktop/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'  # unsigned unless signing is set up
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run config
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: BookPilot-desktop-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run config && npx cap sync android
      - name: Release signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK (install directly) and AAB (Google Play)
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: BookPilot-android
          path: |
            mobile/android/app/build/outputs/apk/**/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run config && npx cap sync ios
      - name: Build for the iOS simulator (checks the app compiles; App Store builds need signing)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Release-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/BookPilot-ios-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: BookPilot-ios-simulator
          path: BookPilot-ios-simulator.zip
          if-no-files-found: error

  ios-appstore:
    # Signed App Store build sent to TestFlight — no Mac needed. It runs only once these repository
    # secrets exist (Settings → Secrets and variables → Actions → Secrets):
    #   APPLE_TEAM_ID       your 10-character Apple Developer team ID
    #   ASC_KEY_ID          App Store Connect API key ID (Users and Access → Integrations → Keys)
    #   ASC_ISSUER_ID       that page's Issuer ID
    #   ASC_KEY_P8          the contents of the downloaded AuthKey_XXXX.p8 file
    # Xcode creates the signing certificate and profile itself (cloud-managed signing).
    runs-on: macos-latest
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check the Apple secrets
        id: ready
        working-directory: .
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Apple secrets not set yet: skipping the App Store build."
          fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.ok == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci && npm run config && npx cap sync ios
      - if: steps.ready.outputs.ok == 'true'
        name: Archive, sign and upload to TestFlight
        working-directory: mobile/ios/App
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" "${AUTH[@]}" archive
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY"
