{% extends "webapp/admin_base.html" %}
{% block title %}Support Ticket{% endblock %}{% block heading %}Support Ticket{% endblock %}
{% block content %}<div class="card" style="max-width:760px;"><h2 style="margin-top:0;">{{ ticket.subject }}</h2><p><strong>Company:</strong> {{ ticket.company.name }}</p><p style="white-space:pre-wrap; color:var(--ink-soft);">{{ ticket.message }}</p><form method="post" class="stacked">{% csrf_token %}{{ form.as_p }}<div style="display:flex; gap:10px; margin-top:20px;"><button class="btn" type="submit">Update ticket</button><a class="btn btn-secondary" href="{% url 'webapp:platform_support_list' %}">Cancel</a></div></form></div>{% endblock %}
