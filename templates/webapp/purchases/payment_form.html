{% extends "base.html" %}
{% block title %}Record payment{% endblock %}
{% block heading %}Record payment to {{ supplier.name }}{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;">
  <form class="stacked" method="post">
    {% csrf_token %}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    {% endfor %}
    <button class="btn" style="margin-top:20px;" type="submit">Record payment</button>
    <a class="btn btn-secondary" style="margin-top:20px; margin-left:8px;" href="{% url 'webapp:supplier_detail' supplier.id %}">Cancel</a>
  </form>
</div>
{% endblock %}
