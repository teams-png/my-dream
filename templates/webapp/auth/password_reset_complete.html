<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Password reset complete</title>
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; background:#f5f7fa; color:#1d2939; }
  .box{ width:360px; background:#fff; border:1px solid #e3e8ef; border-radius:10px; padding:32px; text-align:center; }
  .box h1{ font-size:19px; margin:0 0 8px; }
  .box p{ color:#667085; font-size:13.5px; }
  a{ color:#6d3b63; }
</style>
</head>
<body>
  <div class="box">
    <h1>Password updated</h1>
    <p>You can now sign in with your new password.</p>
    <p><a href="{% url 'webapp:login' %}">Go to login</a></p>
  </div>
</body>
</html>
