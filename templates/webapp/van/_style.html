<style>
.vn{max-width:1100px}
.vn-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}.vn-top .grow{flex:1}
.vn-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.vn-k div{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:10px 14px;min-width:0}.vn-k b{display:block;font-size:19px;overflow-wrap:anywhere}.vn-k small{color:var(--ink-soft)}
.vn-k .warn{border-color:#f59e0b;background:#fffbeb}.vn-k .bad{border-color:#ef4444;background:#fef2f2}
.vn-box{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:14px 16px;margin-bottom:14px;min-width:0}
.vn-box h3{margin:0 0 10px;font-size:16px}
.vn-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}@media(max-width:900px){.vn-grid{grid-template-columns:minmax(0,1fr)}}
.vn-wrap{overflow-x:auto}
.vn-t{width:100%;border-collapse:collapse}.vn-t th,.vn-t td{padding:9px 8px;border-top:1px solid var(--line);text-align:start;vertical-align:middle}.vn-t th{border-top:0;color:var(--ink-soft);font-size:13px;font-weight:600}
.vn-t .n{text-align:end;white-space:nowrap}
.vn-pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px;background:#e0f2fe;color:#075985}
.vn-pill.out{background:#fef3c7;color:#92400e}.vn-pill.closed{background:#dcfce7;color:#166534}
.vn-shop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.vn-shop:first-of-type{border-top:0}
.vn-shop .who{flex:1 1 180px;min-width:0}.vn-shop .who b{display:block;overflow-wrap:anywhere}.vn-shop .who small{color:var(--ink-soft)}
.vn-shop .done{font-size:12px;font-weight:700;color:#166534}
.vn-shop form{display:flex;gap:6px;margin:0;flex-wrap:wrap}.vn-shop input[type=number]{width:110px}
.vn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}.vn-row label{flex:1 1 150px;margin:0}
.vn-share{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px solid #86efac;background:#f0fdf4;border-radius:14px;padding:12px 14px;margin-bottom:14px}
.vn-muted{color:var(--ink-soft);font-size:13px}
.vn-days{display:flex;flex-wrap:wrap;gap:6px}.vn-days label{display:flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:4px 10px;margin:0;font-weight:600}.vn-days input{width:auto;margin:0}
html[data-theme=dark] .vn-k .warn,html[data-theme=dark] .vn-k .bad,html[data-theme=dark] .vn-share{background:transparent}
.vn-form label{display:block;margin:0 0 12px;font-weight:600}.vn-form label input,.vn-form label select{display:block;width:100%;margin-top:4px;font-weight:400}
.vn-form input[type=checkbox]{display:inline-block;width:auto;margin:0}.vn-form .vn-days label{display:flex;margin:0;font-weight:600}
.vn-title{margin:0;font-size:20px;overflow-wrap:anywhere}
</style>
