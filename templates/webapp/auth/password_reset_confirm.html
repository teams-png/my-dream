<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Set new password</title>
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; background:#F4F6FB; color:#12162B; }
  .box{ width:360px; background:#fff; border:1px solid #E7E9F2; border-radius:10px; padding:32px; }
  .box h1{ font-size:19px; margin:0 0 16px; }
  label{ display:block; font-size:13.5px; color:#5F6579; margin:14px 0 5px; }
  input{ width:100%; padding:10px 12px; border:1px solid #E7E9F2; border-radius:6px; font-size:14px; }
  button{ width:100%; margin-top:20px; background:#14532D; color:#fff; border:none; padding:11px; border-radius:6px; font-size:14.5px; cursor:pointer; }
  .errorlist{ color:#C0392B; font-size:12.5px; list-style:none; padding:0; margin:4px 0 0; }
  p{ color:#5F6579; font-size:13.5px; }
</style>
</head>
<body>
  <div class="box">
    {% if validlink %}
    <h1>Set a new password</h1>
    <form method="post">
      {% csrf_token %}
      <label for="{{ form.new_password1.id_for_label }}">New password</label>
      {{ form.new_password1 }}
      {{ form.new_password1.errors }}
      <label for="{{ form.new_password2.id_for_label }}">Confirm new password</label>
      {{ form.new_password2 }}
      {{ form.new_password2.errors }}
      <button type="submit">Set password</button>
    </form>
    {% else %}
    <h1>Link expired</h1>
    <p>This password reset link is invalid or has already been used.</p>
    <p><a href="{% url 'webapp:password_reset' %}">Request a new one</a></p>
    {% endif %}
  </div>
</body>
</html>
