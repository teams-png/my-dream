{% load i18n %}<form method="get" class="hr-actions no-print" style="margin-bottom:14px"><label style="font-weight:600;color:var(--hr-soft)">{% translate "As of" %} <input class="hr-in" style="width:auto" type="date" name="as_of" value="{{ as_of|date:'Y-m-d' }}" onchange="this.form.submit()"></label><button class="btn btn-secondary" type="button" onclick="print()">🖨 {% translate "Print" %}</button>{% if excel %}{% include "webapp/_excel_button.html" %}{% endif %}</form>
<div class="print-head" style="display:none"><b>{{ active_company.name }}</b> · {% translate "As of" %} {{ as_of|date:"j M Y" }}</div>
