{% extends "base.html" %}
{% block title %}Edit permissions{% endblock %}
{% block heading %}Permissions — {{ role.name }}{% endblock %}
{% block content %}
<form method="post">
  {% csrf_token %}
  <div class="card" style="max-width:520px;">
    {% for title, perms in groups %}
    <div style="margin-bottom:16px;">
      <div style="font-weight:600; font-size:13.5px; margin-bottom:6px;">{{ title }}</div>
      {% for perm in perms %}
      <label style="display:block; font-size:13.5px; font-weight:400; margin:4px 0;">
        <input type="checkbox" name="permissions" value="{{ perm.code }}" {% if perm.code in current_codes %}checked{% endif %}>
        {{ perm.label }}
      </label>
      {% endfor %}
    </div>
    {% endfor %}
    <button class="btn" style="margin-top:10px;" type="submit">Save permissions</button>
    <a class="btn btn-secondary" style="margin-top:10px; margin-left:8px;" href="{% url 'webapp:role_list' %}">Cancel</a>
  </div>
</form>
{% endblock %}
