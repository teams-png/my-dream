<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset password</title>
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; background:#F4F6FB; color:#12162B; }
  .box{ width:360px; background:#fff; border:1px solid #E7E9F2; border-radius:10px; padding:32px; }
  .box h1{ font-size:19px; margin:0 0 6px; }
  .box p{ color:#5F6579; font-size:13.5px; margin:0 0 20px; }
  label{ display:block; font-size:13.5px; color:#5F6579; margin:14px 0 5px; }
  input{ width:100%; padding:10px 12px; border:1px solid #E7E9F2; border-radius:6px; font-size:14px; }
  button{ width:100%; margin-top:20px; background:#14532D; color:#fff; border:none; padding:11px; border-radius:6px; font-size:14.5px; cursor:pointer; }
  .errorlist{ color:#C0392B; font-size:12.5px; list-style:none; padding:0; margin:4px 0 0; }
</style>
</head>
<body>
  <div class="box">
    <h1>Reset your password</h1>
    <p>Enter your account email — we'll send a reset link.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.email.errors }}
      <label for="{{ form.email.id_for_label }}">Email</label>
      {{ form.email }}
      <button type="submit">Send reset link</button>
    </form>
  </div>
</body>
</html>
