{% load i18n %}{% get_current_language as CUR_LANG %}{% get_available_languages as LANGS %}<form class="lang-switch" action="{% url 'set_language' %}" method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><label><span aria-hidden="true">🌐</span><span class="sr-only">{% translate "Language" %}</span><select name="language" onchange="this.form.submit()" aria-label="{% translate 'Language' %}">{% for code, name in LANGS %}<option value="{{ code }}" {% if code == CUR_LANG %}selected{% endif %}>{{ name }}</option>{% endfor %}</select></label></form>
