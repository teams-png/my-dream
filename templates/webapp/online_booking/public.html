{% load i18n %}{% get_current_language as LANGUAGE_CODE %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.headline|default:company.name }}</title><meta name="description" content="{{ site.headline|default:company.name }}">
{% if company.logo %}<link rel="icon" href="{{ company.logo.url }}">{% endif %}
<style>body{margin:0;background:#f8fafc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#0f172a}
header{display:flex;align-items:center;gap:10px;padding:14px 18px;background:#fff;border-bottom:1px solid #e2e8f0}
header img{width:36px;height:36px;object-fit:contain;border-radius:8px}header b{font-size:17px}
main{padding:22px 16px 40px}footer{text-align:center;color:#64748b;font-size:13px;padding:0 16px 30px}
@media (prefers-color-scheme:dark){body{background:#0b1220}header{background:#111a2b;border-color:#243042;color:#e2e8f0}}</style></head>
<body><header>{% if company.logo %}<img src="{{ company.logo.url }}" alt="">{% endif %}<b>{{ company.name }}</b></header>
<main><div class="bookpilot-booking" data-lang="{{ LANGUAGE_CODE }}"></div></main>
<footer>{% if company.phone %}{{ company.phone }} · {% endif %}{{ company.address|default:"" }}</footer>
<script src="{{ form_js }}" defer></script></body></html>
