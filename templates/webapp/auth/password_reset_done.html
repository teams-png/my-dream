<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Check your email</title>
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; background:#F4F6FB; color:#12162B; }
  .box{ width:360px; background:#fff; border:1px solid #E7E9F2; border-radius:10px; padding:32px; text-align:center; }
  .box h1{ font-size:19px; margin:0 0 8px; }
  .box p{ color:#5F6579; font-size:13.5px; }
  a{ color:#14532D; }
</style>
</head>
<body>
  <div class="box">
    <h1>Check your email</h1>
    <p>If that email is registered, a reset link has been sent.</p>
    <p><a href="{% url 'webapp:login' %}">Back to login</a></p>
  </div>
</body>
</html>
