{% load i18n %}
{% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
<form class="apply" method="post" action="{% url 'webapp:careers_apply' site.slug %}" enctype="multipart/form-data">
  {% if job %}<input type="hidden" name="job" value="{{ job.id }}">{% endif %}{% if embed %}<input type="hidden" name="embed" value="1">{% endif %}
  <div class="hp" aria-hidden="true"><label>Company website<input name="company_website" tabindex="-1" autocomplete="off"></label></div>
  <div class="full"><label for="f-name">{% translate "Full name (as in passport)" %} <span class="req">*</span></label><input id="f-name" name="name" required maxlength="150" value="{{ post.name|default:'' }}" autocomplete="name"></div>
  <div><label for="f-phone">{% translate "Phone / WhatsApp" %} <span class="req">*</span></label><input id="f-phone" name="phone" required inputmode="tel" maxlength="30" value="{{ post.phone|default:'' }}" placeholder="+91 98765 43210" autocomplete="tel"></div>
  <div><label for="f-email">{% translate "Email" %}</label><input id="f-email" name="email" type="email" maxlength="254" value="{{ post.email|default:'' }}" autocomplete="email"></div>
  <div><label for="f-nat">{% translate "Nationality" %}</label><input id="f-nat" name="nationality" maxlength="100" value="{{ post.nationality|default:'' }}"></div>
  <div><label for="f-pp">{% translate "Passport number" %}{% if site.ask_passport %} <span class="req">*</span>{% endif %}</label><input id="f-pp" name="passport_no" maxlength="30" {% if site.ask_passport %}required{% endif %} value="{{ post.passport_no|default:'' }}" style="text-transform:uppercase"></div>
  <div><label for="f-trade">{% translate "Position / skill" %}</label><input id="f-trade" name="trade" maxlength="150" value="{% if post.trade %}{{ post.trade }}{% elif job %}{{ job.position }}{% endif %}"></div>
  <div><label for="f-exp">{% translate "Experience (years)" %}</label><input id="f-exp" name="experience_years" inputmode="decimal" maxlength="5" value="{{ post.experience_years|default:'' }}"></div>
  <div class="full"><label for="f-loc">{% translate "Where are you now?" %}</label><input id="f-loc" name="current_location" maxlength="150" value="{{ post.current_location|default:'' }}" placeholder="{% translate 'City, country' %}"></div>
  <div class="full"><label for="f-cv">{% translate "CV (PDF, Word or photo, max 8 MB)" %}</label><input id="f-cv" name="cv" type="file" accept=".pdf,.doc,.docx,image/*"></div>
  <div class="full"><label for="f-msg">{% translate "Message (optional)" %}</label><textarea id="f-msg" name="message" rows="3" maxlength="2000">{{ post.message|default:'' }}</textarea></div>
  <div class="full"><button class="btn" type="submit" style="width:100%">{% if job %}{% translate "Apply for this job" %}{% else %}{% translate "Send my CV" %}{% endif %}</button>
    <p style="font-size:12.5px;color:var(--muted);margin:10px 0 0">{% translate "Your details are shared only with" %} {{ company.name }}.</p></div>
</form>
