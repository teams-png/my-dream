<style>
.chat{display:flex;flex-direction:column;min-height:0}
.chat-log{height:min(58vh,560px);overflow-y:auto;padding:16px;background:var(--paper,#f6f7fb);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;gap:12px}
.chat-msg{display:flex;flex-direction:column;max-width:78%}
.chat-msg.mine{align-self:flex-end;align-items:flex-end}
.chat-msg.theirs{align-self:flex-start;align-items:flex-start}
.chat-bubble{padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:14.5px}
.chat-msg.mine .chat-bubble{background:var(--accent);color:#fff;border-end-end-radius:5px}
.chat-msg.theirs .chat-bubble{background:var(--panel,#fff);border:1px solid var(--line);color:var(--ink);border-end-start-radius:5px}
.chat-meta{font-size:11.5px;color:var(--ink-soft);margin-top:4px}
.chat-empty{margin:auto;text-align:center;color:var(--ink-soft);font-size:14px;max-width:360px;line-height:1.6}
.chat-form{display:flex;gap:10px;margin-top:12px;align-items:flex-end}
.chat-form textarea{flex:1;min-height:52px;max-height:180px;resize:vertical;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:var(--panel,#fff);color:var(--ink)}
.chat-form button{flex-shrink:0;height:52px}
.chat-error{color:var(--danger,#c0392b);font-size:13px;margin-top:6px;min-height:1px}
.chat-day{align-self:center;font-size:12px;color:var(--ink-soft);background:var(--panel,#fff);border:1px solid var(--line);padding:3px 10px;border-radius:20px}
@media(max-width:600px){.chat-msg{max-width:90%}.chat-log{height:60vh;padding:12px}}
</style>
