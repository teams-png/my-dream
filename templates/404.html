{% load i18n %}<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% translate "Page not found" %} · BookPilot</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#f4f5f9;color:#12162b;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.box{max-width:440px;text-align:center;background:#fff;border:1px solid #e7e9f2;border-radius:20px;padding:34px 26px}
h1{margin:10px 0 6px;font-size:24px}p{color:#5f6579;margin:0 0 20px}a{display:inline-block;padding:11px 20px;border-radius:12px;background:#14532d;color:#fff;font-weight:700;text-decoration:none}
@media(prefers-color-scheme:dark){body{background:#0e1219;color:#e8ebf2}.box{background:#161b25;border-color:#2a3140}p{color:#9aa3b6}}</style></head>
<body><div class="box"><div style="font-size:46px">🔎</div><h1>{% translate "Page not found" %}</h1>
<p>{% translate "This page doesn't exist or you don't have access to it." %}</p><a href="/">{% translate "Go to Overview" %}</a></div></body></html>
