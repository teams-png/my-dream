{% extends "base.html" %}
{% block title %}Sell unit{% endblock %}
{% block heading %}Sell {{ unit.product.name }} — #{{ unit.serial_number }}{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;">
  <form class="stacked" method="post">
    {% csrf_token %}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    {% endfor %}
    <button class="btn" style="margin-top:20px;" type="submit">Confirm sale</button>
    <a class="btn btn-secondary" style="margin-top:20px; margin-left:8px;" href="{% url 'webapp:cycle_unit_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
