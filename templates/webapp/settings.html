{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block heading %}Business settings{% endblock %}
{% block content %}
<p style="margin:0 0 14px"><a href="{% url 'webapp:setup' step='business' %}">🚀 {% translate "Open the setup wizard" %}</a></p>
<div class="card" style="max-width:460px;">
  <form class="stacked" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    {% endfor %}
    <button class="btn" style="margin-top:20px;" type="submit">Save settings</button>
  </form>
</div>
{% endblock %}
