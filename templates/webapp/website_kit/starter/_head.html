<!doctype html>
<html lang="{{ lang }}"{% if rtl %} dir="rtl"{% endif %}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ name }}{% endblock %}</title>
<meta name="description" content="{{ name }}">
<!-- Bootstrap 5 from a CDN: change the theme freely, BookPilot widgets keep working -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap{% if rtl %}.rtl{% endif %}.min.css" rel="stylesheet">
<link href="assets/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">{{ name }}</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto gap-lg-2">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        {% if shop %}<li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>{% endif %}
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        {% if phone %}<li class="nav-item"><a class="btn btn-brand ms-lg-2" href="tel:{{ phone }}">Call us</a></li>{% endif %}
      </ul>
    </div>
  </div>
</nav>
