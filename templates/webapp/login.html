{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Business Console</title>
<style>
  @font-face { font-family:'Inter'; src:url('{% static "fonts/Inter-Regular.ttf" %}') format('truetype'); font-weight:400; font-display:swap; }
  @font-face { font-family:'Inter'; src:url('{% static "fonts/Inter-Medium.ttf" %}') format('truetype'); font-weight:500; font-display:swap; }
  @font-face { font-family:'Inter'; src:url('{% static "fonts/Inter-SemiBold.ttf" %}') format('truetype'); font-weight:600; font-display:swap; }
  @font-face { font-family:'Inter'; src:url('{% static "fonts/Inter-Bold.ttf" %}') format('truetype'); font-weight:700; font-display:swap; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Inter',-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; background:#f4f6fb; color:#12162b;
  }
  .box{width:340px; background:#fff; border:1px solid #e7e9f2; border-radius:12px; padding:32px; box-shadow:0 1px 2px rgba(18,22,43,0.03);}
  .box h1{font-size:20px; font-weight:700; margin:0 0 4px;}
  .box p{color:#5f6579; font-size:13.5px; margin:0 0 22px;}
  label{display:block; font-size:13.5px; font-weight:600; color:#5f6579; margin:14px 0 6px;}
  input{width:100%; padding:10px 12px; border:1.5px solid #e7e9f2; border-radius:10px; font-size:14.5px; font-family:inherit; transition:border-color .15s ease;}
  input:focus{outline:none; border-color:#14532d;}
  button{
    width:100%; margin-top:20px; background:#14532d; color:#fff; border:none; padding:12px;
    border-radius:10px; font-size:14.5px; font-weight:600; cursor:pointer;
  }
  button:hover{opacity:0.92;}
  .err{background:#fdeceb; color:#c0392b; padding:10px 13px; border-radius:10px; font-size:13.5px; font-weight:500; margin-bottom:14px;}
</style>
</head>
<body>
  <div class="box">
    <h1>Sign in</h1>
    <p>Manage your business — sales, stock, and reports.</p>
    {% if messages %}
      {% for message in messages %}<div class="err">{{ message }}</div>{% endfor %}
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <label for="username">Username</label>
      <input id="username" name="username" autofocus required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>
      <button type="submit">Sign in</button>
    </form>
    <p style="text-align:center; margin-top:14px; font-size:13px;"><a href="{% url 'webapp:password_reset' %}" style="color:#14532d; font-weight:600;">Forgot password?</a></p>
    <p style="text-align:center; margin-top:6px; font-size:13px; color:#5f6579;">New here? <a href="{% url 'webapp:signup' %}" style="color:#14532d; font-weight:600;">Start a free trial</a></p>
  </div>
</body>
</html>
