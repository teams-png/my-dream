{% extends "base.html" %}
{% block title %}Create role{% endblock %}
{% block heading %}Create custom role{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;">
  <form class="stacked" method="post">
    {% csrf_token %}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    {% endfor %}
    <button class="btn" style="margin-top:20px;" type="submit">Create</button>
    <a class="btn btn-secondary" style="margin-top:20px; margin-left:8px;" href="{% url 'webapp:role_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
