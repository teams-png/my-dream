<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BookPilot</title>
<style>
:root{--ink:#12162b;--soft:#5f6579;--brand:#14532d;--bg:#f4f6fb}
@media (prefers-color-scheme:dark){:root{--ink:#eef2fa;--soft:#9aa6bd;--bg:#0d111b}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
img{width:88px;height:88px;border-radius:24px;box-shadow:0 14px 34px rgba(20,83,45,.35);animation:f 3s ease-in-out infinite}
h1{font-size:22px;margin:18px 0 6px}p{color:var(--soft);margin:0 0 20px}
button{min-height:48px;padding:0 26px;border:0;border-radius:14px;background:var(--brand);color:#fff;font:inherit;font-weight:700}
@keyframes f{50%{transform:translateY(-6px)}}
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>No connection</h1>
  <p>BookPilot needs the internet to open.<br>It will try again by itself.</p>
  <button id="retry" type="button">Try again</button>
</main>
<script src="app-config.js"></script>
<script src="error.js"></script>
</body>
</html>
