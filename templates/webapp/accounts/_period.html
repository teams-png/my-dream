{% load i18n %}<div class="no-print" style="margin-bottom:14px">
  <div class="hr-actions" style="margin-bottom:8px">{% for key, label in periods %}<a class="hr-chip {% if preset == key %}ok{% endif %}" style="font-size:13px;padding:7px 12px" href="?period={{ key }}{{ extra_q }}">{{ label }}</a>{% endfor %}</div>
  <form method="get" class="hr-actions">{{ hidden|default:"" }}<input class="hr-in" style="width:auto" type="date" name="from" value="{{ start|date:'Y-m-d' }}" aria-label="{% translate 'From' %}"><input class="hr-in" style="width:auto" type="date" name="to" value="{{ end|date:'Y-m-d' }}" aria-label="{% translate 'To' %}"><button class="btn btn-secondary" type="submit">{% translate "Apply" %}</button><button class="btn btn-secondary" type="button" onclick="print()">🖨 {% translate "Print" %}</button></form>
</div>
<div class="print-head" style="display:none"><b>{{ active_company.name }}</b> · {% if start %}{{ start|date:"j M Y" }} – {% endif %}{{ end|date:"j M Y" }}</div>
